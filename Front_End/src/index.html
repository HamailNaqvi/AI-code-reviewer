<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="./output.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>

<body class="bg-black p-10">

<section class="flex flex-col items-center justify-center">

  <div class="text-white font-saira text-5xl p-10">AI Code Reviewer</div>

<div
  id="editor"
  class=" w-2xl min-h-32 max-h-auto border-2 border-amber-400/40 rounded-xl shadow-[0_0_20px_rgba(251,191,36,0.2)] overflow-hidden">
</div>


  <div class="p-5">
    <button class="p-3 font-saira bg-amber-500 rounded-2xl text-black"
      onclick="reviewCode()">
      Review
    </button>
  </div>

  <div id="result"
    class="w-2xl max-w-3xl h-auto min-h-32 bg-white/15 rounded-3xl border-2 border-amber-300/35 text-white p-4">
  </div>

</section>

<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
<script src="script.js"></script>

</body>
</html>
